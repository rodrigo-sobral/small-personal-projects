x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

networks:
  # Bridge network Traefik and every reverse-proxied service sit on
  web:
    name: web
  # Internal-only network for backend databases/caches (no direct exposure)
  backend:
    name: backend
    internal: true

volumes:
  tailscale_data:
  vaultwarden_db:
  vaultwarden_data:
  octoprint_data:
  pihole_data:
  pihole_dnsmasq:
  scheduler_data:
  scheduler_logs:
  nextcloud_html:
  nextcloud_apps:
  nextcloud_config:
  nextcloud_data:
  nextcloud_db:
  redis_data:
  authentik_db:
  authentik_media:
  authentik_certs:
  authentik_templates:
  immich_db:
  jellyfin_config:
  jellyfin_cache:
  minecraft_data:
  stirling_configs:
  stirling_tessdata:
  stirling_logs:
  stirling_pipeline:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_cache:
  beszel_data:
  beszel_agent_data:
  # Shared between the Beszel hub and agent: the agent listens on a unix
  # socket in here instead of a TCP port, so nothing extra is exposed.
  beszel_socket:
  # AI assistant: Ollama's model store and Open WebUI's database/uploads.
  ollama_data:
  openwebui_data:

services:
  # ==========================================================================
  # REMOTE ACCESS
  # ==========================================================================
  tailscale:
    <<: *defaults
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: raspi-server
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      # Advertises the whole LAN to the tailnet, so remote devices (like your
      # Mac when it's not on the home Wi-Fi) can reach Pi-hole's real LAN IP
      # through the tunnel. Requires one manual approval step in the
      # Tailscale admin console after first boot - see README.
      TS_ROUTES: ${LOCAL_SUBNET}
      TS_EXTRA_ARGS: --reset
    volumes:
      - tailscale_data:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1

  # ==========================================================================
  # INGRESS - single reverse proxy for the whole stack, TLS terminates here
  # ==========================================================================
  traefik:
    <<: *defaults
    image: traefik:v3.1
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Separate unpublished entrypoint on :8082 for /ping only. The `web`
      # entrypoint redirects everything to HTTPS, so a check there would only
      # ever see a 301. Not in `ports:`, so it's reachable from the `web`
      # network and nowhere else.
      - "--entrypoints.ping.address=:8082"
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs:ro
    networks:
      - web
    extra_hosts:
      # Lets containers on the "web" network reach the host itself, needed to
      # route to host-networked Pi-hole (see the pihole service below).
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      # --- dashboard, protected with basic auth, internal use only ---
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN_BASE}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      # Basic auth, not Authentik: the dashboard is the thing you need when
      # Authentik won't start.
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # IDENTITY / SINGLE SIGN-ON - Authentik
  #
  # Becomes Traefik's forward-auth provider once configured: a login at
  # auth.${DOMAIN_BASE} can gate any other router. The middleware lives in
  # traefik/dynamic/authentik.yml and is NOT attached to anything by default -
  # attaching it before Authentik is configured would lock you out.
  # No Redis: Postgres backs cache and task queue (since 2025.8).
  # ==========================================================================
  authentik-db:
    <<: *defaults
    image: postgres:16-alpine
    container_name: authentik-db
    # shared_buffers defaults to 128 MB per instance; with several databases on
    # an 8 GB Pi that's wasteful. It's only a cache, so shrinking it trades a
    # little cache hit rate for RAM. max_connections is similarly oversized.
    command:
      - postgres
      - "-c"
      - "shared_buffers=32MB"
      - "-c"
      - "max_connections=30"
      - "-c"
      - "work_mem=2MB"
    environment:
      TZ: ${TZ}
      POSTGRES_DB: authentik
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - authentik_db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d authentik"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"

  authentik-server:
    <<: *defaults
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    container_name: authentik-server
    command: server
    depends_on:
      authentik-db:
        condition: service_healthy
    environment: &authentik-env
      TZ: ${TZ}
      # Without this, browser redirects fall back to http://localhost.
      AUTHENTIK_WEB__BASE_URL: https://auth.${DOMAIN_BASE}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      # One gunicorn worker: each is a full Python process (~260 MB). Raise if
      # you ever see requests queueing.
      AUTHENTIK_WEB__WORKERS: "1"
      # Read by authentik/blueprints/homelab.yaml. The blueprint builds every
      # host/redirect URI from DOMAIN_BASE; the OIDC pairs stay in .env.
      DOMAIN_BASE: ${DOMAIN_BASE}
      IMMICH_OIDC_CLIENT_ID: ${IMMICH_OIDC_CLIENT_ID}
      IMMICH_OIDC_CLIENT_SECRET: ${IMMICH_OIDC_CLIENT_SECRET}
      NEXTCLOUD_OIDC_CLIENT_ID: ${NEXTCLOUD_OIDC_CLIENT_ID}
      NEXTCLOUD_OIDC_CLIENT_SECRET: ${NEXTCLOUD_OIDC_CLIENT_SECRET}
      JELLYFIN_OIDC_CLIENT_ID: ${JELLYFIN_OIDC_CLIENT_ID}
      JELLYFIN_OIDC_CLIENT_SECRET: ${JELLYFIN_OIDC_CLIENT_SECRET}
      BESZEL_OIDC_CLIENT_ID: ${BESZEL_OIDC_CLIENT_ID}
      BESZEL_OIDC_CLIENT_SECRET: ${BESZEL_OIDC_CLIENT_SECRET}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      # Declarative config: providers, applications and the outpost wiring.
      # Authentik watches this directory and re-applies on change.
      - ./authentik/blueprints:/blueprints/homelab:ro
    networks:
      - web
      - backend
    # No host port publishing: Traefik fronts 9000 like every other service.
    shm_size: 512mb
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN_BASE}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"

  # Runs migrations, scheduled tasks and outpost management. Needs the docker
  # socket so Authentik can deploy outpost containers on its own if you ever
  # ask it to; the embedded outpost used by the Traefik middleware doesn't
  # require that, so drop the socket mount if you'd rather not grant it.
  authentik-worker:
    <<: *defaults
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    container_name: authentik-worker
    command: worker
    user: root
    depends_on:
      authentik-db:
        condition: service_healthy
    environment: *authentik-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik_media:/media
      - authentik_certs:/certs
      - authentik_templates:/templates
      # The worker is what actually applies blueprints, so it needs them too.
      - ./authentik/blueprints:/blueprints/homelab:ro
    networks:
      - web
      - backend
    shm_size: 512mb
    # No healthcheck block on purpose: the authentik image ships its own
    # HEALTHCHECK, same as Immich's containers do, and upstream's compose file
    # doesn't override it either.
    deploy:
      resources:
        limits:
          cpus: "1.00"

  # ==========================================================================
  # PASSWORD MANAGER
  # ==========================================================================
  vaultwarden-db:
    <<: *defaults
    image: postgres:16-alpine
    container_name: vaultwarden-db
    # Same reasoning as authentik-db above.
    command:
      - postgres
      - "-c"
      - "shared_buffers=32MB"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "work_mem=2MB"
    environment:
      TZ: ${TZ}
      POSTGRES_DB: vaultwarden
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - vaultwarden_db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d vaultwarden"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"

  vaultwarden:
    <<: *defaults
    image: vaultwarden/server:latest
    container_name: vaultwarden
    depends_on:
      vaultwarden-db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@vaultwarden-db:5432/vaultwarden
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_WORKERS: 4
      DOMAIN: "https://vaultwarden.${DOMAIN_BASE}"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      JWT_SECRET: ${VAULTWARDEN_JWT_SECRET}
      LOG_FILE: /data/vaultwarden.log
    volumes:
      - vaultwarden_data:/data
    networks:
      - web
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.${DOMAIN_BASE}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/alive || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.00"

  # ==========================================================================
  # 3D PRINTER MANAGEMENT
  # ==========================================================================
  octoprint:
    <<: *defaults
    image: octoprint/octoprint:latest
    container_name: octoprint
    environment:
      TZ: ${TZ}
      OCTOPRINT_USER: ${OCTOPRINT_USER}
      OCTOPRINT_PASS: ${OCTOPRINT_PASS}
      ENABLE_MJPG_STREAMER: true
      MJPG_STREAMER_INPUT: "-r 640x480 -f 10 -y"
    volumes:
      - octoprint_data:/octoprint
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.octoprint.rule=Host(`octoprint.${DOMAIN_BASE}`)"
      - "traefik.http.routers.octoprint.entrypoints=websecure"
      - "traefik.http.routers.octoprint.tls=true"
      - "traefik.http.services.octoprint.loadbalancer.server.port=5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --fail http://127.0.0.1:5000 || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
    # Uncomment when printer is connected
    # devices:
    # - /dev/ttyUSB0:/dev/ttyUSB0
    # - /dev/video0:/dev/video0

  # ==========================================================================
  # DNS / AD-BLOCKING / DHCP
  # ==========================================================================
  pihole:
    <<: *defaults
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pihole
    # Host networking, not macvlan: macvlan gives Pi-hole its own virtual MAC,
    # which most Wi-Fi APs silently drop. Host mode reuses the Pi's working
    # interface, so DHCP/DNS broadcast and outbound fetches work over Wi-Fi.
    network_mode: host
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_upstreams: "${PIHOLE_UPSTREAM_DNS_1};${PIHOLE_UPSTREAM_DNS_2}"
      # Web UI moved off :80 since Traefik owns host ports 80/443.
      FTLCONF_webserver_port: "8081o"
      # Pi-hole is the LAN's DHCP + DNS authority.
      FTLCONF_dhcp_active: "true"
      FTLCONF_dhcp_start: ${PIHOLE_DHCP_START}
      FTLCONF_dhcp_end: ${PIHOLE_DHCP_END}
      FTLCONF_dhcp_router: ${PIHOLE_DHCP_ROUTER}
      FTLCONF_dhcp_netmask: ${PIHOLE_DHCP_NETMASK}
      # Local DNS Records seeded from SERVER_LAN_IP, so every *.home.arpa name
      # points at the Pi without admin-UI work. Semicolon-separated "IP host".
      FTLCONF_dns_hosts: >-
        ${SERVER_LAN_IP} ${DOMAIN_BASE};
        ${SERVER_LAN_IP} vaultwarden.${DOMAIN_BASE};
        ${SERVER_LAN_IP} octoprint.${DOMAIN_BASE};
        ${SERVER_LAN_IP} pihole.${DOMAIN_BASE};
        ${SERVER_LAN_IP} nextcloud.${DOMAIN_BASE};
        ${SERVER_LAN_IP} traefik.${DOMAIN_BASE};
        ${SERVER_LAN_IP} auth.${DOMAIN_BASE};
        ${SERVER_LAN_IP} immich.${DOMAIN_BASE};
        ${SERVER_LAN_IP} jellyfin.${DOMAIN_BASE};
        ${SERVER_LAN_IP} pdf.${DOMAIN_BASE};
        ${SERVER_LAN_IP} beszel.${DOMAIN_BASE};
        ${SERVER_LAN_IP} glance.${DOMAIN_BASE};
        ${SERVER_LAN_IP} office.${DOMAIN_BASE};
        ${SERVER_LAN_IP} ai.${DOMAIN_BASE};
        ${SERVER_LAN_IP} minecraft.${DOMAIN_BASE}
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN # required for DHCP server
      - SYS_TIME # required for NTP client
      - SYS_NICE # extra scheduling priority for FTL
    # No Traefik labels: host-networked containers aren't discoverable via
    # docker labels. Traefik routes to it via traefik/dynamic/pihole.yml.
    healthcheck:
      test: ["CMD-SHELL", "pihole status || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"

  # No pihole-exporter: Glance's dns-stats widget reads Pi-hole's API directly.

  # ==========================================================================
  # DISCORD SCHEDULER BOT
  # ==========================================================================
  scheduler-bot:
    <<: *defaults
    image: ghcr.io/${GITHUB_USERNAME}/scheduler-discord-bot:latest
    container_name: scheduler_bot
    user: "1000:1000"
    environment:
      TZ: ${TZ}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${BOT_DATABASE_URL}
      ENVIRONMENT: ${BOT_ENVIRONMENT}
      LOG_LEVEL: ${BOT_LOG_LEVEL}
    volumes:
      - scheduler_data:/app/db
      - scheduler_logs:/app/logs
    networks:
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
        reservations:
          cpus: "0.50"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # Glance reads this metadata through its existing read-only Docker socket.
      - "glance.name=Discord scheduler"
      - "glance.icon=si:discord"
      - "glance.category=bot"
      - "glance.hide=false"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 86400 --cleanup --label-enable
    restart: "no"
    networks:
      - web

  # ==========================================================================
  # NEXTCLOUD (files, calendar, mail)
  # ==========================================================================
  nextcloud:
    <<: *defaults
    image: nextcloud:latest
    container_name: nextcloud
    depends_on:
      nextclouddb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - web
      - backend
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_apps:/var/www/html/custom_apps
      - nextcloud_config:/var/www/html/config
      - nextcloud_data:/var/www/html/data
      - ./nextcloud/onlyoffice.config.php:/var/www/html/config/onlyoffice.config.php:ro
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
      MYSQL_HOST: nextclouddb
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud nextcloud.${DOMAIN_BASE}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://nextcloud.${DOMAIN_BASE}
      REDIS_HOST: redis
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN_BASE}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --fail http://127.0.0.1:80/status.php || exit 1",
        ]
      interval: 1m
      timeout: 10s
      retries: 3

  nextclouddb:
    <<: *defaults
    image: mariadb:latest
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    networks:
      - backend
    volumes:
      - nextcloud_db:/var/lib/mysql
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 5

  redis:
    <<: *defaults
    image: redis:alpine
    container_name: redis
    volumes:
      - redis_data:/data
    networks:
      - backend

  # Create/edit files (collaborative mode) in Nextcloud. No need to expose via Traefik, Nextcloud handles the proxying internally
  collabora:
    <<: *defaults
    image: collabora/code
    container_name: collabora
    networks:
      - backend
    environment:
      TZ: ${TZ}
      username: ${COLLABORA_ADMIN_USER}
      password: ${COLLABORA_ADMIN_PASSWORD}
      domain: nextcloud\\.${DOMAIN_BASE}
      extra_params: --o:ssl.enable=false --o:ssl.termination=true

  # ==========================================================================
  # DOCUMENT EDITING - ONLYOFFICE Document Server
  #
  # Does the same job as `collabora` above but is far heavier. Run only one
  # of them. Unlike Collabora, this is exposed through Traefik because the
  # browser loads its editor's JS directly from this host.
  #
  # No Authentik middleware here (see README): Nextcloud calls it
  # server-to-server and the browser loads assets / opens a websocket
  # cross-origin, so a forward-auth redirect breaks both. JWT is its auth.
  # ==========================================================================
  onlyoffice:
    <<: *defaults
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    environment:
      TZ: ${TZ}
      # JWT is enabled by default with a random secret, which would make it
      # impossible to pair with Nextcloud - so it's pinned here.
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
      # ONLYOFFICE fetches the document from Nextcloud over HTTPS, signed by
      # this stack's private CA, which the container doesn't trust. It also
      # refuses private address ranges by default (SSRF guard), so both must
      # be relaxed for a homelab.
      USE_UNAUTHORIZED_STORAGE: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      # Rendered-document cache. Not in the config this started from, but
      # without it every restart re-renders everything and the layer grows
      # inside the container instead of a volume.
      - onlyoffice_cache:/var/lib/onlyoffice
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.onlyoffice.rule=Host(`office.${DOMAIN_BASE}`)"
      - "traefik.http.routers.onlyoffice.entrypoints=websecure"
      - "traefik.http.routers.onlyoffice.tls=true"
      - "traefik.http.services.onlyoffice.loadbalancer.server.port=80"
      # ONLYOFFICE builds absolute URLs and websockets from X-Forwarded-Proto.
      # Without it, it emits http:// URLs into an https:// page and the browser
      # blocks them as mixed content.
      - "traefik.http.middlewares.onlyoffice-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.onlyoffice.middlewares=onlyoffice-headers"
    # Probe the internal docservice on :8000, not the :80 nginx that answers
    # long before the editor is ready.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/info/info.json"]
      interval: 30s
      timeout: 10s
      retries: 5
      # It boots a bundled PostgreSQL, RabbitMQ and Redis before doc services.
      start_period: 5m
    # The supervisor inside wants a TTY; a short stop timeout leaves the
    # bundled database unclean.
    stdin_open: true
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.00"

  # ==========================================================================
  # PHOTOS - Immich
  #
  # Three containers: the API/web server, Valkey for the job queue, and a
  # pgvector-flavoured Postgres. The machine-learning sidecar is deliberately
  # omitted (heaviest thing in the stack); turn ML off in Immich's Settings
  # too. The library is a host bind mount, not a volume.
  # ==========================================================================
  immich-server:
    <<: *defaults
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich_server
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_started
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - web
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.immich.rule=Host(`immich.${DOMAIN_BASE}`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls=true"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
    deploy:
      resources:
        limits:
          cpus: "2.00"

  immich-redis:
    <<: *defaults
    image: valkey/valkey:9
    container_name: immich_redis
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  immich-db:
    <<: *defaults
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    # Must keep `-c config_file=...`: that file sets shared_preload_libraries
    # (vchord, vectors), so dropping it breaks Immich's search. It ships a
    # 512 MB default shared_buffers, tuned down here for a Pi.
    command:
      - postgres
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=30"
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich_db:/var/lib/postgresql/data
    networks:
      - backend
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MEDIA LIBRARY - Jellyfin
  #
  # Runs as root (the default for the official image - it has no PUID/PGID
  # support, and a non-root `user:` can't write to a fresh docker volume).
  # Media is a bind mount for the same reason as Immich's library: it's yours,
  # it's big, and you'll want it on a real path you can rsync.
  # ==========================================================================
  jellyfin:
    <<: *defaults
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      TZ: ${TZ}
      # Otherwise clients advertising via autodiscovery use the container IP.
      JELLYFIN_PublishedServerUrl: "https://jellyfin.${DOMAIN_BASE}"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${JELLYFIN_MEDIA_PATH}:/media
    ports:
      # Client autodiscovery broadcast (UDP, so not proxied by Traefik).
      - "7359:7359/udp"
    networks:
      - web
    # No hardware transcode on a Pi 5: no H.264 encoder, no VAAPI render node.
    # On a Pi 4, uncomment this and keep it:
    # devices:
    #   - /dev/dri:/dev/dri
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN_BASE}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.00"

  # ==========================================================================
  # GAME SERVER - Minecraft (Java Edition)
  #
  # The only non-HTTP service, so the only one with a published host port and
  # no Traefik router. Players connect to minecraft.${DOMAIN_BASE}:25565.
  # ==========================================================================
  minecraft:
    <<: *defaults
    image: itzg/minecraft-server:latest
    container_name: minecraft
    # The image's console needs an attached TTY for `docker attach` (running
    # server commands without RCON).
    stdin_open: true
    tty: true
    environment:
      TZ: ${TZ}
      EULA: true
      TYPE: ${MINECRAFT_TYPE}
      VERSION: ${MINECRAFT_VERSION}
      # `MEMORY` is deliberately NOT set: it pins -Xms and -Xmx to the same
      # value, claiming the full amount at startup and holding it. Splitting
      # INIT/MAX lets the heap start small and grow on demand. A grown heap
      # only shrinks during a periodic GC, hence the JVM_XX_OPTS below.
      INIT_MEMORY: ${MINECRAFT_INIT_MEMORY}
      MAX_MEMORY: ${MINECRAFT_MAX_MEMORY}
      JVM_XX_OPTS: "-XX:G1PeriodicGCInterval=60000 -XX:G1PeriodicGCSystemLoadThreshold=0"
      DIFFICULTY: ${MINECRAFT_DIFFICULTY}
      MAX_PLAYERS: ${MINECRAFT_MAX_PLAYERS}
      MOTD: ${MINECRAFT_MOTD}
      OPS: ${MINECRAFT_OPS}
      # Port 25565 is the one thing reachable off-LAN, so the whitelist is on.
      ENABLE_WHITELIST: "false"
      WHITELIST: ${MINECRAFT_WHITELIST}
      VIEW_DISTANCE: "10" # Max 32; lower on a Pi to reduce CPU load.
      UID: 1000
      GID: 1000
      RCON_CMDS_STARTUP: |-
        gamerule keep_inventory true
    volumes:
      - minecraft_data:/data
    ports:
      - "25565:25565/tcp"
    networks:
      - web
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 5m
    deploy:
      resources:
        limits:
          cpus: "2.00"

  # ==========================================================================
  # DOCUMENT TOOLS - Stirling PDF
  # ==========================================================================
  stirling-pdf:
    <<: *defaults
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    environment:
      TZ: ${TZ}
      # Its own login is disabled; Authentik is the login instead.
      SECURITY_ENABLELOGIN: "false"
      SYSTEM_DEFAULTLOCALE: ${STIRLING_LOCALE}
      SYSTEM_ENABLEANALYTICS: "false"
      # Cap the JVM heap; unbounded, it sizes from host RAM (2 GB ceiling on
      # an 8 GB Pi) and grows into it. Raise this first on OCR of large docs.
      JAVA_CUSTOM_OPTS: "-Xmx384m"
    volumes:
      - stirling_configs:/configs
      - stirling_tessdata:/usr/share/tessdata
      - stirling_logs:/logs
      - stirling_pipeline:/pipeline
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.stirling-pdf.rule=Host(`pdf.${DOMAIN_BASE}`)"
      - "traefik.http.routers.stirling-pdf.entrypoints=websecure"
      - "traefik.http.routers.stirling-pdf.tls=true"
      - "traefik.http.services.stirling-pdf.loadbalancer.server.port=8080"
      # Authentik is this service's login (its own is disabled above).
      - "traefik.http.routers.stirling-pdf.middlewares=authentik@file"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/api/v1/info/status || exit 1",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.50"

  # ==========================================================================
  # AI - local LLM chat (Ollama + Open WebUI)
  #
  # Ollama runs the model on the Pi's CPU (there is no GPU). Keep the model
  # small and unload it when idle: this box already runs close to its RAM
  # ceiling, and a loaded 1.7B model is ~1.5 GB. Open WebUI is the browser UI;
  # its web search uses DDGS, which ships inside the image, so no separate
  # search service is needed.
  #
  # Auth: Open WebUI trusts the X-authentik-email header injected by Traefik's
  # forward-auth middleware, so the one Authentik login covers it. That holds
  # only while nothing else can reach it directly - it is not published to the
  # host and only sits on the "web" network.
  # ==========================================================================
  ollama:
    <<: *defaults
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      TZ: ${TZ}
      # Drop the model after 5 minutes idle, and serve one model/one request at
      # a time. Without this an idle Open WebUI keeps the whole model resident.
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # The image defaults to 0.0.0.0 as well, but be explicit so Open WebUI can
      # reach it across the "web" network.
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.00"

  open-webui:
    <<: *defaults
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_URL: "https://ai.${DOMAIN_BASE}"
      # Signs sessions. Generated by scripts/07_setup-ai.sh; keep it stable.
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
      # Login is Authentik. The header below is injected by the authentik@file
      # middleware attached to this router; Open WebUI auto-creates the account
      # on first sight (first user becomes admin). No local passwords.
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-authentik-email
      WEBUI_AUTH_TRUSTED_NAME_HEADER: X-authentik-name
      ENABLE_LOGIN_FORM: "false"
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: user
      # Web search: DDGS ships inside Open WebUI, so this needs no other service.
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: duckduckgo
      DDGS_BACKEND: auto
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.open-webui.rule=Host(`ai.${DOMAIN_BASE}`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
      # Authentik is the login (Open WebUI trusts the identity header above).
      - "traefik.http.routers.open-webui.middlewares=authentik@file"
    # No healthcheck block: the image ships its own (curl /health), like Immich.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.50"

  # ==========================================================================
  # MONITORING - Beszel
  #
  # Replaced Prometheus + Grafana + Uptime Kuma + four exporters. The agent
  # reads host and per-container metrics (was cadvisor + node-exporter), keeps
  # its own history and alerting, and Glance's monitors cover the up/down and
  # block-stats views. Nothing here watches TLS cert expiry.
  # ==========================================================================
  # The hub: web UI, history storage and alert evaluation.
  beszel:
    <<: *defaults
    image: henrygd/beszel:latest
    container_name: beszel
    environment:
      TZ: ${TZ}
      APP_URL: "https://beszel.${DOMAIN_BASE}"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
      # Written by scripts/03_setup-beszel.sh: config.yml declares the system
      # and token; id_ed25519 pins the hub's SSH key so the agent's public key
      # is known before the hub first runs. Together the agent self-registers
      # with no UI steps. The hub only generates a key when this file is
      # absent, so mounting read-only is enough to pin it.
      - ./beszel/config.yml:/beszel_data/config.yml:ro
      - ./beszel/id_ed25519:/beszel_data/id_ed25519:ro
    ports:
      # Loopback only, so the host-networked agent can reach the hub to
      # auto-register without trusting the private CA. Browsers still go
      # through Traefik on 443.
      - "127.0.0.1:8091:8090"
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.beszel.rule=Host(`beszel.${DOMAIN_BASE}`)"
      - "traefik.http.routers.beszel.entrypoints=websecure"
      - "traefik.http.routers.beszel.tls=true"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"
    deploy:
      resources:
        limits:
          cpus: "0.50"

  # The agent that reads this host's stats. Host-networked so it sees the real
  # interfaces (same reasoning as Pi-hole), and it listens on a unix socket in
  # the shared volume rather than a TCP port - the hub dials the agent.
  beszel-agent:
    <<: *defaults
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host
    environment:
      TZ: ${TZ}
      LISTEN: /beszel_socket/beszel.sock
      # Plain HTTP over loopback (see the hub's port mapping above).
      HUB_URL: "http://localhost:8091"
      TOKEN: ${BESZEL_TOKEN}
      KEY: ${BESZEL_KEY}
      # No discrete GPU on a Pi; skips a probe that would only ever fail.
      SKIP_GPU: "true"
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      # Read-only; this is how it attributes CPU/RAM per container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - beszel
    deploy:
      resources:
        limits:
          cpus: "0.25"

  # ==========================================================================
  # TLS CERTIFICATE RENEWAL
  #
  # Checks daily and reissues the leaf cert inside its renewal window, then
  # triggers a Traefik reload. Never touches the root CA, so renewals are
  # invisible to clients. Gets no docker socket - just write access to the
  # cert, Glance assets and Traefik dynamic directories.
  # ==========================================================================
  cert-renew:
    <<: *defaults
    image: alpine:3.22
    container_name: cert-renew
    environment:
      TZ: ${TZ}
      DOMAIN_BASE: ${DOMAIN_BASE}
      # Kept in sync with the SAN list so a renewal doesn't drop tailnet access.
      TAILSCALE_IP: ${TAILSCALE_IP}
      CERT_RENEW_BEFORE_DAYS: ${CERT_RENEW_BEFORE_DAYS}
      # Point the script at the container's mount paths, not the repo layout.
      OUT_DIR: /certs
      GLANCE_ASSETS_DIR: /assets
      TRAEFIK_DYNAMIC_DIR: /dynamic
    volumes:
      - ./scripts:/scripts:ro
      - ./traefik/certs:/certs
      - ./traefik/dynamic:/dynamic
      - ./glance/assets:/assets
    # bash and openssl aren't in the base image; install at start to avoid
    # adding a build step to an otherwise build-free repo.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache bash openssl >/dev/null
        echo "cert-renew: checking every 24h, renewing under $${CERT_RENEW_BEFORE_DAYS}d remaining"
        while true; do
          /scripts/maintenance/renew-certs.sh || echo "cert-renew: check failed, will retry in 24h"
          sleep 86400
        done
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"

  # ==========================================================================
  # DASHBOARD - Glance
  #
  # The stack's front door, on both glance.${DOMAIN_BASE} and the bare domain.
  # Serves the root CA for download and the first-run setup notes as well.
  # Edit glance/glance.yml and restart this container to change it.
  # ==========================================================================
  glance:
    <<: *defaults
    image: glanceapp/glance:latest
    container_name: glance
    environment:
      TZ: ${TZ}
      # Glance substitutes ${DOMAIN_BASE} in glance.yml from its own env, so
      # the config file needs no editing when the domain changes.
      DOMAIN_BASE: ${DOMAIN_BASE}
      WEATHER_LOCATION: ${WEATHER_LOCATION}
      # Read by glance.yml's dns-stats widget.
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      BESZEL_URL: http://beszel:8090
      BESZEL_TOKEN: ${BESZEL_TOKEN}
      BESZEL_USER_TOKEN: ${BESZEL_USER_TOKEN}
      BESZEL_SYSTEM_NAME: ${BESZEL_SYSTEM_NAME:-raspi-server}
      IMMICH_URL: ${IMMICH_URL}
      IMMICH_KEY: ${IMMICH_KEY}
      JELLYFIN_URL: ${JELLYFIN_URL}
      JELLYFIN_KEY: ${JELLYFIN_KEY}
      JELLYFIN_USER: ${JELLYFIN_USER}
      TAILSCALE_API_KEY: ${TAILSCALE_API_KEY}
    volumes:
      - ./glance/glance.yml:/app/config/glance.yml:ro
      # Theme definitions, pulled in by glance.yml via `theme: $include:`.
      - ./glance/themes.yml:/app/config/themes.yml:ro
      # Required for the widget includes referenced from glance.yml.
      - ./glance/widgets:/app/config/widgets:ro
      # Served under /assets/: rootCA.pem and cert-expiry.txt, written by
      # scripts/05_setup-ca.sh.
      - ./glance/assets:/app/assets:ro
      # Read-only, for the docker-containers widget.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    extra_hosts:
      # Needed to reach host-networked Pi-hole for the dns-stats widget.
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Also answers on the bare domain, inherited from the portal it replaced.
      - "traefik.http.routers.glance.rule=Host(`glance.${DOMAIN_BASE}`) || Host(`${DOMAIN_BASE}`)"
      - "traefik.http.routers.glance.entrypoints=websecure"
      - "traefik.http.routers.glance.tls=true"
      - "traefik.http.services.glance.loadbalancer.server.port=8080"
      # Authentik is this dashboard's login - Glance has no account system of
      # its own, and this page exposes the container list and DNS stats.
      #
      # /assets/* stays reachable without logging in, via skip_path_regex on
      # the forward-auth provider (authentik/blueprints/homelab.yaml). That's
      # deliberate: rootCA.pem lives there, and you need it before your browser
      # will trust the login page. It's a public CA cert - nothing to protect.
      - "traefik.http.routers.glance.middlewares=authentik@file"
    deploy:
      resources:
        limits:
          cpus: "0.50"
