# Authentik blueprint: everything this homelab needs, pre-created.
#
# Mounted read-only at /blueprints/homelab in both the server and worker
# containers. Authentik discovers it on startup, applies it in a single atomic
# transaction (any failure rolls the whole thing back), watches the file for
# changes, and re-applies every 60 minutes. So this file is the source of
# truth: edit it and restart authentik-worker rather than clicking in the UI.
#
# Model names and attribute names below are taken from authentik's own
# blueprint JSON schema for the pinned AUTHENTIK_TAG (2026.8.0). If you bump
# that tag by a major version, re-check them against
#   https://github.com/goauthentik/authentik/blob/version/<tag>/blueprints/schema.json
#
# ---------------------------------------------------------------------------
# The design: ONE forward-auth provider, not one per service
# ---------------------------------------------------------------------------
# The proxy provider below uses mode `forward_domain`, which covers *every*
# host under the cookie domain with a single provider, application and cookie.
# That's what makes "one set of credentials for everything" actually true: to
# put a new service behind SSO you add one Traefik label to it and nothing
# here changes.
#
# The alternative (`forward_single`) needs a provider + application per
# service and a separate login redirect for each. Same credentials, but far
# more moving parts for no benefit on a single-domain homelab.
# ---------------------------------------------------------------------------

version: 1
metadata:
  name: homelab
  labels:
    blueprints.goauthentik.io/description: Homelab SSO - forward auth + OIDC providers

context:
  domain: !Env [DOMAIN_BASE, home.arpa]

entries:
  # =========================================================================
  # Group every human in this house belongs to. Bind policies to this rather
  # than to individual users, so adding a family member is one click.
  # =========================================================================
  - model: authentik_core.group
    id: group-homelab
    identifiers:
      name: homelab-users
    attrs:
      is_superuser: false

  # =========================================================================
  # FORWARD AUTH - one provider per protected host
  # =========================================================================
  - model: authentik_providers_proxy.proxyprovider
    id: provider-forward-home-v2
    identifiers:
      name: homelab-home-forward-auth-v2
    attrs:
      name: homelab-home-forward-auth-v2
      mode: forward_single
      external_host: !Format ["https://%s", !Context domain]
      cookie_domain: ""
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      skip_path_regex: |
        ^/favicon\.ico$
        ^/robots\.txt$
        ^/assets/.*$

  - model: authentik_core.application
    id: app-forward-home-v2
    identifiers:
      slug: homelab-home-v2
    attrs:
      name: Homelab Home V2
      slug: homelab-home-v2
      provider: !KeyOf provider-forward-home-v2
      meta_description: Single sign-on for the homelab dashboard.
      meta_launch_url: !Format ["https://%s", !Context domain]
      policy_engine_mode: any

  - model: authentik_providers_proxy.proxyprovider
    id: provider-forward-glance-v2
    identifiers:
      name: homelab-glance-forward-auth-v2
    attrs:
      name: homelab-glance-forward-auth-v2
      mode: forward_single
      external_host: !Format ["https://glance.%s", !Context domain]
      cookie_domain: ""
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      skip_path_regex: |
        ^/favicon\.ico$
        ^/robots\.txt$
        ^/assets/.*$

  - model: authentik_core.application
    id: app-forward-glance-v2
    identifiers:
      slug: homelab-glance-v2
    attrs:
      name: Homelab Glance V2
      slug: homelab-glance-v2
      provider: !KeyOf provider-forward-glance-v2
      meta_description: Single sign-on for the homelab dashboard.
      meta_launch_url: !Format ["https://glance.%s", !Context domain]
      policy_engine_mode: any

  - model: authentik_providers_proxy.proxyprovider
    id: provider-forward-stirling
    identifiers:
      name: homelab-stirling-forward-auth
    attrs:
      name: homelab-stirling-forward-auth
      mode: forward_single
      external_host: !Format ["https://pdf.%s", !Context domain]
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      skip_path_regex: |
        ^/favicon\.ico$
        ^/robots\.txt$

  - model: authentik_core.application
    id: app-forward-stirling
    identifiers:
      slug: homelab-stirling
    attrs:
      name: Homelab Stirling PDF
      slug: homelab-stirling
      provider: !KeyOf provider-forward-stirling
      meta_description: Single sign-on for Stirling PDF
      meta_launch_url: !Format ["https://pdf.%s", !Context domain]
      policy_engine_mode: any

  - model: authentik_providers_proxy.proxyprovider
    id: provider-forward-ai
    identifiers:
      name: homelab-ai-forward-auth
    attrs:
      name: homelab-ai-forward-auth
      mode: forward_single
      external_host: !Format ["https://ai.%s", !Context domain]
      cookie_domain: ""
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      skip_path_regex: |
        ^/favicon\.ico$
        ^/robots\.txt$

  - model: authentik_core.application
    id: app-forward-ai
    identifiers:
      slug: homelab-ai
    attrs:
      name: Homelab AI
      slug: homelab-ai
      provider: !KeyOf provider-forward-ai
      meta_description: Local LLM chat and web search (Open WebUI)
      meta_launch_url: !Format ["https://ai.%s", !Context domain]
      policy_engine_mode: any

  # Attach the provider to the built-in embedded outpost. Without this the
  # middleware in traefik/dynamic/authentik.yml has nothing to talk to and
  # every protected route returns a 400.
  - model: authentik_outposts.outpost
    id: outpost-embedded
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      config:
        authentik_host: !Format ["https://auth.%s", !Context domain]
        authentik_host_browser: !Format ["https://auth.%s", !Context domain]
      providers:
        - !KeyOf provider-forward-home-v2
        - !KeyOf provider-forward-glance-v2
        - !KeyOf provider-forward-stirling
        - !KeyOf provider-forward-ai

  # =========================================================================
  # OIDC PROVIDERS - for apps with native SSO support
  #
  # These exist so the *authentik side* is done for you. Each still needs its
  # counterpart configured inside the app itself (client id + secret, and for
  # some, a plugin) - those steps are in the README, and they're unavoidable:
  # nothing here can reach into Jellyfin's plugin catalogue for you.
  #
  # Client IDs and secrets come from .env via !Env so they stay out of git and
  # match what you paste into each app.
  # =========================================================================

  # --- Immich: OAuth2/OIDC is built in, no plugin needed. ------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-immich
    identifiers:
      name: immich
    attrs:
      name: immich
      client_type: confidential
      client_id: !Env [IMMICH_OIDC_CLIENT_ID, ""]
      client_secret: !Env [IMMICH_OIDC_CLIENT_SECRET, ""]
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # RS256. Without a signing key authentik falls back to HS256, which
      # Immich's OIDC client rejects.
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        # Browser callback.
        - matching_mode: strict
          url: !Format ["https://immich.%s/auth/login", !Context domain]
        - matching_mode: strict
          url: !Format ["https://immich.%s/user-settings", !Context domain]
        # The mobile app's custom scheme - without this, phone logins fail
        # while the browser works, which is a confusing way to find out.
        - matching_mode: strict
          url: app.immich:///oauth-callback

  - model: authentik_core.application
    identifiers:
      slug: immich
    attrs:
      name: Immich
      slug: immich
      provider: !KeyOf provider-immich
      meta_launch_url: !Format ["https://immich.%s", !Context domain]
      meta_description: Photo and video library

  # --- Nextcloud: needs the "OpenID Connect user backend" app installed. ---
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-nextcloud
    identifiers:
      name: nextcloud
    attrs:
      name: nextcloud
      client_type: confidential
      client_id: !Env [NEXTCLOUD_OIDC_CLIENT_ID, ""]
      client_secret: !Env [NEXTCLOUD_OIDC_CLIENT_SECRET, ""]
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - matching_mode: strict
          url:
            !Format [
              "https://nextcloud.%s/apps/user_oidc/code",
              !Context domain,
            ]

  - model: authentik_core.application
    identifiers:
      slug: nextcloud
    attrs:
      name: Nextcloud
      slug: nextcloud
      provider: !KeyOf provider-nextcloud
      meta_launch_url: !Format ["https://nextcloud.%s", !Context domain]
      meta_description: Files, calendar and mail

  # --- Jellyfin: needs the third-party SSO plugin. -------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-jellyfin
    identifiers:
      name: jellyfin
    attrs:
      name: jellyfin
      client_type: confidential
      client_id: !Env [JELLYFIN_OIDC_CLIENT_ID, ""]
      client_secret: !Env [JELLYFIN_OIDC_CLIENT_SECRET, ""]
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - matching_mode: regex
          url: !Format ["https://jellyfin\\.%s/sso/OID/.*", !Context domain]

  - model: authentik_core.application
    identifiers:
      slug: jellyfin
    attrs:
      name: Jellyfin
      slug: jellyfin
      provider: !KeyOf provider-jellyfin
      meta_launch_url: !Format ["https://jellyfin.%s", !Context domain]
      meta_description: Movies, shows and music

  # --- Beszel: PocketBase underneath, which speaks OIDC. ------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-beszel
    identifiers:
      name: beszel
    attrs:
      name: beszel
      client_type: confidential
      client_id: !Env [BESZEL_OIDC_CLIENT_ID, ""]
      client_secret: !Env [BESZEL_OIDC_CLIENT_SECRET, ""]
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - matching_mode: strict
          url:
            !Format ["https://beszel.%s/api/oauth2-redirect", !Context domain]

  - model: authentik_core.application
    identifiers:
      slug: beszel
    attrs:
      name: Beszel
      slug: beszel
      provider: !KeyOf provider-beszel
      meta_launch_url: !Format ["https://beszel.%s", !Context domain]
      meta_description: Host and container monitoring
