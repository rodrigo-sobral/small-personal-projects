modules:
  https_2xx_selfsigned:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200, 301, 302, 401]  # 401 covers services with basic auth in front
      preferred_ip_protocol: "ip4"
      tls_config:
        # Self-signed local CA: skip chain validation but still report cert expiry.
        # For stricter checks, mount rootCA.pem into blackbox-exporter and set
        # ca_file instead of insecure_skip_verify.
        insecure_skip_verify: true
