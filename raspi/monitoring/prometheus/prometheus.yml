global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Real ad-blocking stats: queries blocked, % blocked, blocklist size
  - job_name: pihole
    static_configs:
      - targets: ["pihole-exporter:9617"]

  # HTTPS uptime/latency/cert-expiry probes for every browser-facing service
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [https_2xx_selfsigned]
    static_configs:
      - targets:
          - https://vaultwarden.home.arpa
          - https://octoprint.home.arpa
          - https://pihole.home.arpa/admin
          - https://nextcloud.home.arpa
          - https://portal.home.arpa
          - https://grafana.home.arpa
        labels:
          group: "services"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
