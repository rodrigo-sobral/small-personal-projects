# Adapted from the vetted "Immich Styled Stats" community widget.
- type: custom-api
  title: Immich library
  title-url: https://immich.${DOMAIN_BASE}
  cache: 10m
  url: ${IMMICH_URL}/api/server/statistics
  headers:
    x-api-key: ${IMMICH_KEY}
  subrequests:
    storage:
      url: ${IMMICH_URL}/api/server/storage
      headers:
        x-api-key: ${IMMICH_KEY}
  template: |
    {{ $photos := .JSON.Int "photos" }}
    {{ $videos := .JSON.Int "videos" }}
    {{ $usageGiB := div (toFloat (.JSON.Int "usage")) 1073741824.0 }}
    {{ $storage := .Subrequest "storage" }}
    {{ $storageOK := and (ge $storage.Response.StatusCode 200) (le $storage.Response.StatusCode 299) }}
    <div class="flex flex-column gap-10">
      <div class="flex gap-10">
        <div class="grow padding-widget widget-content-frame">
          <div class="color-subdue size-h6">PHOTOS</div>
          <div class="size-h2 color-primary">{{ $photos | formatNumber }}</div>
        </div>
        <div class="grow padding-widget widget-content-frame">
          <div class="color-subdue size-h6">VIDEOS</div>
          <div class="size-h2 color-primary">{{ $videos | formatNumber }}</div>
        </div>
        <div class="grow padding-widget widget-content-frame">
          <div class="color-subdue size-h6">LIBRARY</div>
          <div class="size-h2 color-primary">{{ printf "%.0f" $usageGiB }} GiB</div>
        </div>
      </div>
      {{ if $storageOK }}
        {{ $used := $storage.JSON.Float "diskUsagePercentage" }}
        {{ $totalGiB := div (toFloat ($storage.JSON.Int "diskSizeRaw")) 1073741824.0 }}
        <div class="color-subdue size-h6"><span class="i18n" lang="en">Storage:</span><span class="i18n" lang="pt">Armazenamento:</span> {{ printf "%.1f" $usageGiB }} / {{ printf "%.1f" $totalGiB }} GiB ({{ printf "%.1f" $used }}%)</div>
      {{ else }}
        <div class="color-negative size-h6"><span class="i18n" lang="en">Storage total unavailable — grant server.storage to IMMICH_KEY.</span><span class="i18n" lang="pt">Armazenamento total indisponível — concede server.storage à IMMICH_KEY.</span></div>
      {{ end }}
    </div>
