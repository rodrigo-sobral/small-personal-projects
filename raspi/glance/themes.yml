# Theme configuration for the Glance dashboard.
#
# Included from glance.yml via:
#     theme:
#       $include: themes.yml
#
# The first block is the default theme; every entry under `presets` is offered
# in the theme picker. Preset keys are the theme identifiers (also stored in the
# `theme` cookie), so rename them with care - an existing browser selection
# falls back to the default if its key disappears.
#
# Presets are sorted from darkest to brightest by the background colour's
# lightness (the third HSL number). The community themes are named after
# Glance's own docs/themes.md.

# --- default theme --------------------------------------------------------
background-color: 222 25 11
primary-color: 172 72 56
contrast-multiplier: 1.12
# Bilingual prose pairs use .i18n spans toggled by html[data-lang].
custom-css-file: /assets/i18n.css

presets:
