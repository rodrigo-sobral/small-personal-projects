                  </li>
                </ul>
                <p class="color-subdue size-h6 margin-top-10">
                  <span class="i18n" lang="en">Pi-hole is this network's DHCP server, so devices pick up DNS on
                  their next lease renewal. Local DNS records for every
                  <code>*.${DOMAIN_BASE}</code> name are seeded from
                  <code>SERVER_LAN_IP</code> &mdash; nothing to add by hand. A blank
                  page on a <code>*.${DOMAIN_BASE}</code> address is a DNS problem,
                  not a TLS one; a cert issue shows a full warning page instead.</span>
                  <span class="i18n" lang="pt">O Pi-hole é o servidor DHCP desta rede, por isso os dispositivos
                  recebem o DNS na próxima renovação da concessão. Os registos DNS
                  locais para todos os nomes <code>*.${DOMAIN_BASE}</code> são criados
                  a partir de <code>SERVER_LAN_IP</code> &mdash; nada a adicionar
                  manualmente. Uma página em branco num endereço
                  <code>*.${DOMAIN_BASE}</code> é um problema de DNS, não de TLS; um
                  problema de certificado mostra uma página de aviso completa.</span>
                </p>
