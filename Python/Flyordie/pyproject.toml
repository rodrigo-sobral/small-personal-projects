[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "flyordie"
version = "1.0.0"
description = "A modern desktop viewer and Elo simulator for public FlyOrDie player statistics."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rodrigo"}]
dependencies = [
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.scripts]
flyordie = "flyordie.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "watchfiles>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flyordie"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "flyordie/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
